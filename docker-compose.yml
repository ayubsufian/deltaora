services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - deltaora-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - deltaora-network
    restart: unless-stopped

networks:
  deltaora-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
