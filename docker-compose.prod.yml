# ─────────────────────────────────────────────────────────────
# Deltaora — Production Docker Compose
#
# Usage (on your production server):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Images are pre-built by CI/CD and pulled from GHCR.
# ─────────────────────────────────────────────────────────────

services:
  frontend:
    image: ghcr.io/ayubsufian/deltaora-frontend:latest
    networks:
      - deltaora-network
    restart: unless-stopped

  backend:
    image: ghcr.io/ayubsufian/deltaora-backend:latest
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL}
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:-deltaora}:${MONGO_ROOT_PASSWORD}@mongodb:27017/deltaora?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - MFA_SECRET_ENCRYPTION_KEY=${MFA_SECRET_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN}
      - PASSWORD_BREACH_SCREENING_MODE=${PASSWORD_BREACH_SCREENING_MODE}
      - PASSWORD_BREACH_SCREENING_FAILURE_POLICY=${PASSWORD_BREACH_SCREENING_FAILURE_POLICY}
      - PASSWORD_BREACH_SCREENING_TIMEOUT_MS=${PASSWORD_BREACH_SCREENING_TIMEOUT_MS}
      - PASSWORD_BREACH_SCREENING_CACHE_TTL_SECONDS=${PASSWORD_BREACH_SCREENING_CACHE_TTL_SECONDS}
      - PASSWORD_BREACH_SCREENING_CACHE_MAX_PREFIXES=${PASSWORD_BREACH_SCREENING_CACHE_MAX_PREFIXES}
      - PASSWORD_BREACH_SCREENING_LOCAL_DIR=${PASSWORD_BREACH_SCREENING_LOCAL_DIR}
      - PWNED_PASSWORDS_RANGE_URL=${PWNED_PASSWORDS_RANGE_URL}
      - PWNED_PASSWORDS_USER_AGENT=${PWNED_PASSWORDS_USER_AGENT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CRAWLER_USER_AGENT=${CRAWLER_USER_AGENT}
      - CRAWLER_CONTACT_URL=${CRAWLER_CONTACT_URL}
      - CRAWLER_RESPECT_ROBOTS=${CRAWLER_RESPECT_ROBOTS}
      - CRAWLER_ALLOW_PRIVATE_NETWORKS=${CRAWLER_ALLOW_PRIVATE_NETWORKS}
      - CRAWLER_PRIVATE_NETWORK_ALLOWLIST=${CRAWLER_PRIVATE_NETWORK_ALLOWLIST}
      - CRAWLER_ROBOTS_UNAVAILABLE_POLICY=${CRAWLER_ROBOTS_UNAVAILABLE_POLICY}
      - CRAWLER_MAX_BYTES=${CRAWLER_MAX_BYTES}
      - CRAWLER_MAX_REDIRECTS=${CRAWLER_MAX_REDIRECTS}
      - CRAWLER_MIN_HOST_DELAY_MS=${CRAWLER_MIN_HOST_DELAY_MS}
      - CRAWLER_ROBOTS_CACHE_SECONDS=${CRAWLER_ROBOTS_CACHE_SECONDS}
      - CRAWLER_ROBOTS_MAX_BYTES=${CRAWLER_ROBOTS_MAX_BYTES}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - PROXY_URL=${PROXY_URL}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - deltaora-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-deltaora}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - deltaora-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - deltaora-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - deltaora-network
    restart: unless-stopped

networks:
  deltaora-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
