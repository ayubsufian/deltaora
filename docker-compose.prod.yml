# ─────────────────────────────────────────────────────────────
# Deltaora — Production Docker Compose
#
# Usage (on your production server):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Images are pre-built by CI/CD and pulled from GHCR.
# ─────────────────────────────────────────────────────────────

services:
  frontend:
    image: ghcr.io/ayubsufian/deltaora-frontend:latest
    networks:
      - deltaora-network
    restart: unless-stopped

  backend:
    image: ghcr.io/ayubsufian/deltaora-backend:latest
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL}
      - MONGODB_URI=mongodb://mongodb:27017/deltaora
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - MFA_SECRET_ENCRYPTION_KEY=${MFA_SECRET_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN}
      - PASSWORD_BREACH_SCREENING_MODE=${PASSWORD_BREACH_SCREENING_MODE}
      - PASSWORD_BREACH_SCREENING_FAILURE_POLICY=${PASSWORD_BREACH_SCREENING_FAILURE_POLICY}
      - PASSWORD_BREACH_SCREENING_TIMEOUT_MS=${PASSWORD_BREACH_SCREENING_TIMEOUT_MS}
      - PASSWORD_BREACH_SCREENING_CACHE_TTL_SECONDS=${PASSWORD_BREACH_SCREENING_CACHE_TTL_SECONDS}
      - PASSWORD_BREACH_SCREENING_CACHE_MAX_PREFIXES=${PASSWORD_BREACH_SCREENING_CACHE_MAX_PREFIXES}
      - PASSWORD_BREACH_SCREENING_LOCAL_DIR=${PASSWORD_BREACH_SCREENING_LOCAL_DIR}
      - PWNED_PASSWORDS_RANGE_URL=${PWNED_PASSWORDS_RANGE_URL}
      - PWNED_PASSWORDS_USER_AGENT=${PWNED_PASSWORDS_USER_AGENT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - deltaora-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - deltaora-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - deltaora-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - deltaora-network
    restart: unless-stopped

networks:
  deltaora-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
