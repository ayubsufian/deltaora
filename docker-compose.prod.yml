# ─────────────────────────────────────────────────────────────
# Deltaora — Production Docker Compose
#
# Usage (on your production server):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Images are pre-built by CI/CD and pulled from GHCR.
# ─────────────────────────────────────────────────────────────

services:
  frontend:
    image: ghcr.io/ayubsufian/deltaora-frontend:latest
    ports:
      - "5173:80"
    networks:
      - deltaora-network
    restart: unless-stopped

  backend:
    image: ghcr.io/ayubsufian/deltaora-backend:latest
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/deltaora
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - deltaora-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - deltaora-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - deltaora-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - deltaora-network
    restart: unless-stopped

networks:
  deltaora-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
